[package]
name = "yunji-tauri"
version = "26.10.16"
description = "云记 - 资源管理桌面应用"
authors = ["you"]
edition = "2021"
default-run = "yunji-tauri"

[lib]
name = "yunji_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 核心
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# 数据库
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }

# 异步运行时
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 错误处理
anyhow = "1"
thiserror = "2"

# 认证
argon2 = "0.5"
rand = "0.8"

# 文件存储（本地磁盘，单一实现）
bytes = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

# 时间
chrono = { version = "0.4", features = ["serde"] }

# 日志
tracing = "0.1"
tracing-subscriber = "0.3"

# URL 编码
urlencoding = "2"
html-escape = "0.2"

# 正则
regex = "1"

# 机器翻译引擎的签名（百度 MD5 / 腾讯云 TC3-HMAC-SHA256）
md-5 = "0.10"
hmac = "0.12"
sha2 = "0.10"

# 网页采集（HTTP 抓取）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "gzip", "brotli", "deflate", "charset", "stream"] }

# 查找可执行文件
which = "6"

# Windows 系统代理读取（Clash/V2Ray 等多为系统代理，reqwest 默认不识别）
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# 全局状态
once_cell = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
